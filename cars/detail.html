<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Supercar World | Araba Detayı</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #101116;
      color: #f5f5f7;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    a { color: #ff6464; }

    .eyebrow {
      margin-top: 32px;
      color: #ff6464;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 64px);
      line-height: 1.1;
    }

    h2 { margin-top: 36px; }

    .intro {
      max-width: 760px;
      color: #c4c4cd;
      font-size: 18px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .gallery-item {
      overflow: hidden;
      display: block;
      background: #202128;
      border: 1px solid #353640;
      border-radius: 14px;
      color: white;
      text-decoration: none;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      transition: transform .25s;
    }

    .gallery-item:hover img { transform: scale(1.04); }

    .gallery-item span {
      display: block;
      padding: 10px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .specs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .spec {
      padding: 18px;
      border: 1px solid #353640;
      border-radius: 12px;
      background: #1b1c23;
    }

    .spec span {
      display: block;
      color: #aaaab6;
      font-size: 14px;
    }

    .spec strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
    }

    .fact {
      margin-top: 30px;
      padding: 22px;
      border-left: 4px solid #ff6464;
      border-radius: 8px;
      background: #1b1c23;
    }

    .disclaimer {
      margin-top: 32px;
      color: #aaaab6;
      font-size: 13px;
    }
  </style>
</head>
<body data-slug="ferrari-296">
  <main id="app">
    <p>Araba bilgileri yükleniyor...</p>
  </main>

  <script src="car-detail.js"></script>
</body>
</html>
