<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NORRVEYO | Süper Otomobiller</title>
<style>

* {
  box-sizing: border-box;
}

:root {
  --bg: #090a0d;
  --panel: #13151a;
  --panel-light: #1b1e25;
  --red: #f21d35;
  --red-dark: #a80e22;
  --text: #f5f5f7;
  --muted: #a3a7b1;
  --border: #292d36;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 20px;
}

body {
  margin: 0;
  background:
    radial-gradient(ellipse at 50% 0%, #341018 0%, transparent 38%),
    var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.6;
}

header {
  position: relative;
  overflow: hidden;
  padding: 54px 20px 48px;
  text-align: center;
  background: linear-gradient(135deg, #1a0b10, #090a0d 65%);
  border-bottom: 1px solid #52202a;
}

header h1 {
  margin: 0;
  font-size: clamp(36px, 6vw, 64px);
  font-weight: 900;
  letter-spacing: 5px;
  text-shadow: 0 0 28px #f21d3538;
}

header p {
  color: #c7c7ce;
  margin: 10px 0 0;
  font-size: 15px;
  letter-spacing: 1px;
}

nav {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 15px;
  background: #0d0e12ee;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
}

nav a {
  color: #dddfe5;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  transition: color .2s;
}

nav a:hover {
  color: var(--red);
}

main {
  width: min(1200px, 100%);
  margin: auto;
  padding: 30px 22px;
}

main > h2,
.compare h2 {
  font-size: clamp(23px, 3vw, 32px);
  letter-spacing: -.5px;
}

main > p,
.compare > p {
  color: var(--muted);
}

.tools {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 24px 0;
}

input,
select,
button {
  min-height: 46px;
  padding: 12px 15px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid #353944;
  border-radius: 9px;
  font: inherit;
}

input {
  flex: 1;
  min-width: 210px;
}

input:focus,
select:focus {
  outline: 2px solid #f21d3580;
  border-color: var(--red);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
  gap: 20px;
}

.card {
  display: block;
  min-width: 0;
  overflow: hidden;
  color: var(--text);
  text-decoration: none;
  background: linear-gradient(145deg, #1a1c22, #101115);
  border: 1px solid var(--border);
  border-radius: 14px;
  transition: transform .25s, border-color .25s, box-shadow .25s;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #d51d33;
  box-shadow: 0 12px 35px #0008, 0 0 18px #f21d3510;
}

.car-art {
  height: 190px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: radial-gradient(ellipse at center, #30323a, #14151a 75%);
  border-bottom: 1px solid #292c34;
}

.car-art img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform .35s;
}

.card:hover .car-art img {
  transform: scale(1.045);
}

.card-content {
  padding: 19px;
}

.brand {
  color: #ff5265;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.card h3 {
  margin: 6px 0 13px;
  font-size: 21px;
  font-weight: 800;
}

.spec {
  color: #c1c4cd;
  font-size: 13px;
  line-height: 2;
}

.price {
  margin-top: 12px;
  color: white;
  font-size: 14px;
  font-weight: 800;
}

.detail-link {
  display: inline-block;
  margin-top: 15px;
  padding: 9px 13px;
  color: white;
  background: linear-gradient(110deg, #b30f26, #f21d35);
  border-radius: 7px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .3px;
}

.compare {
  margin-top: 48px;
  padding: clamp(18px, 4vw, 32px);
  background: linear-gradient(145deg, #191b21, #101115);
  border: 1px solid var(--border);
  border-radius: 16px;
}

.compare select {
  max-width: 100%;
  margin: 5px;
}

button {
  background: linear-gradient(110deg, #b30f26, #f21d35);
  border: 0;
  font-weight: bold;
  cursor: pointer;
  transition: filter .2s, transform .2s;
}

button:hover {
  filter: brightness(1.18);
  transform: translateY(-1px);
}

#result {
  margin-top: 20px;
  line-height: 1.8;
  overflow-x: auto;
  overflow-wrap: anywhere;
}

#result table {
  width: 100%;
  min-width: 600px;
  border-collapse: collapse;
  font-size: 13px;
}

#result th {
  padding: 13px 10px;
  color: #ff6374;
  background: #202229;
  text-align: center;
}

#result td {
  padding: 12px 10px;
  border-bottom: 1px solid #30333b;
  text-align: center;
}

#result td:first-child {
  text-align: left;
  font-weight: bold;
}

footer {
  margin-top: 55px;
  padding: 28px 15px;
  color: #8f939d;
  background: #0d0e12;
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 12px;
  letter-spacing: .5px;
}

@media (max-width: 600px) {
  header {
    padding: 38px 14px;
  }

  header h1 {
    letter-spacing: 3px;
  }

  nav {
    gap: 22px;
  }

  main {
    padding: 22px 14px;
  }

  .grid {
    grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
    gap: 12px;
  }

  .car-art {
    height: 145px;
  }

  .card-content {
    padding: 13px;
  }

  .card h3 {
    font-size: 17px;
  }

  .spec {
    font-size: 12px;
  }

  .compare {
    padding: 15px;
  }

  .tools > * {
    width: 100%;
  }
}
</style>
</head>
<body>
<header>
<h1>🏎️ NORRVEYO</h1>
<p>Dünyanın en özel süper otomobillerini keşfet!</p>
</header>

<nav>
<a href="#cars">Arabalar</a>
<a href="#compare">Karşılaştırma</a>
</nav>

<main>
<h2 id="cars">🚘 Süper otomobil koleksiyonu</h2>
<p>20 efsane otomobili keşfet, detaylarını incele ve karşılaştır.</p>

<div class="tools">
<input id="search" placeholder="Araba veya marka ara..." aria-label="Araba ara">
<select id="brand" aria-label="Markaya göre filtrele">
<option value="">Bütün markalar</option>
<option>Ferrari</option>
<option>Lamborghini</option>
<option>McLaren</option>
<option>Porsche</option>
<option>Bugatti</option>
</select>
</div>

<div id="cars" class="grid"></div>

<section id="compare" class="compare">
<h2>⚡ Araba karşılaştır</h2>
<p>İki araba seç ve özelliklerini yan yana incele.</p>
<select id="car1" aria-label="Birinci araba"></select>
<select id="car2" aria-label="İkinci araba"></select>
<button id="compareButton">Arabaları karşılaştır</button>
<div id="result"></div>
</section>
</main>

<footer>© 2026 NORRVEYO · Otomobil tutkunları için</footer>

<script>
const cars = [
{name:"296 GTB",brand:"Ferrari",slug:"ferrari-296",power:830,zero:2.9,speed:330,price:"Yaklaşık 300.000 $",image:"https://commons.wikimedia.org/wiki/Special:FilePath/Ferrari_296_GTB_1.jpg"},
{name:"SF90 Stradale",brand:"Ferrari",slug:"ferrari-sf90",power:1000,zero:2.5,speed:340,price:"Yaklaşık 500.000 $",image:"https://images.unsplash.com/photo-1592198084033-aade902d1aae?auto=format&fit=crop&w=900&q=80"},
{name:"F8 Tributo",brand:"Ferrari",slug:"ferrari-f8",power:720,zero:2.9,speed:340,price:"Fiyatı değişebilir",image:"https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=900&q=80"},
{name:"812 Competizione",brand:"Ferrari",slug:"ferrari-812-competizione",power:830,zero:2.9,speed:340,price:"Sınırlı üretim",image:"https://commons.wikimedia.org/wiki/Special:FilePath/Ferrari_812_Competizione.jpg"},
{name:"Daytona SP3",brand:"Ferrari",slug:"ferrari-daytona-sp3",power:840,zero:2.9,speed:340,price:"Sınırlı üretim",image:"https://commons.wikimedia.org/wiki/Special:FilePath/Ferrari_Daytona_SP3.jpg"},

{name:"Revuelto",brand:"Lamborghini",slug:"lamborghini-revuelto",power:1015,zero:2.5,speed:350,price:"Yaklaşık 600.000 $",image:"https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=900&q=80"},
{name:"Huracán STO",brand:"Lamborghini",slug:"lamborghini-huracan-sto",power:640,zero:3.0,speed:310,price:"Yaklaşık 330.000 $",image:"https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=900&q=80"},
{name:"Aventador SVJ",brand:"Lamborghini",slug:"lamborghini-aventador-svj",power:770,zero:2.8,speed:350,price:"İkinci el fiyatı değişir",image:"https://commons.wikimedia.org/wiki/Special:FilePath/Lamborghini_Aventador_SVJ.jpg"},
{name:"Temerario",brand:"Lamborghini",slug:"lamborghini-temerario",power:920,zero:2.7,speed:340,price:"Fiyatı değişebilir",image:"https://commons.wikimedia.org/wiki/Special:FilePath/Lamborghini_Temerario.jpg"},
{name:"Sián FKP 37",brand:"Lamborghini",slug:"lamborghini-sian",power:819,zero:2.8,speed:350,price:"Sınırlı üretim",image:"https://commons.wikimedia.org/wiki/Special:FilePath/2022_Lamborghini_Sian_FKP_37.jpg"},

{name:"750S",brand:"McLaren",slug:"mclaren-750s",power:750,zero:2.8,speed:332,price:"Yaklaşık 330.000 $",image:"https://commons.wikimedia.org/wiki/Special:FilePath/McLaren_750S.jpg"},
{name:"765LT",brand:"McLaren",slug:"mclaren-765lt",power:765,zero:2.8,speed:330,price:"Sınırlı üretim",image:"https://commons.wikimedia.org/wiki/Special:FilePath/McLaren_765LT.jpg"},
{name:"Artura",brand:"McLaren",slug:"mclaren-artura",power:700,zero:3.0,speed:330,price:"Yaklaşık 250.000 $",image:"https://commons.wikimedia.org/wiki/Special:FilePath/2024_McLaren_Artura.jpg"},
{name:"P1",brand:"McLaren",slug:"mclaren-p1",power:916,zero:2.8,speed:350,price:"İkinci el fiyatı değişir",image:"https://commons.wikimedia.org/wiki/Special:FilePath/McLaren_P1.jpg"},
{name:"Senna",brand:"McLaren",slug:"mclaren-senna",power:800,zero:2.8,speed:335,price:"Sınırlı üretim",image:"https://commons.wikimedia.org/wiki/Special:FilePath/McLaren_Senna.jpg"},

{name:"911 GT3 RS",brand:"Porsche",slug:"porsche-911-gt3-rs",power:525,zero:3.2,speed:296,price:"Yaklaşık 250.000 $",image:"https://commons.wikimedia.org/wiki/Special:FilePath/2023_Porsche_911_GT3_RS.jpg"},
{name:"911 Turbo S",brand:"Porsche",slug:"porsche-911-turbo-s",power:650,zero:2.7,speed:330,price:"Yaklaşık 230.000 $",image:"https://commons.wikimedia.org/wiki/Special:FilePath/2024_Porsche_911_Turbo_S.jpg"},
{name:"918 Spyder",brand:"Porsche",slug:"porsche-918-spyder",power:887,zero:2.6,speed:345,price:"İkinci el fiyatı değişir",image:"https://commons.wikimedia.org/wiki/Special:FilePath/Porsche_918_Spyder.jpg"},

{name:"Chiron",brand:"Bugatti",slug:"bugatti-chiron",power:1500,zero:2.4,speed:420,price:"Milyonlarca dolar",image:"https://commons.wikimedia.org/wiki/Special:FilePath/Bugatti_Chiron.jpg"},
{name:"Tourbillon",brand:"Bugatti",slug:"bugatti-tourbillon",power:1800,zero:2.0,speed:445,price:"Yaklaşık 4 milyon €",image:"https://commons.wikimedia.org/wiki/Special:FilePath/Bugatti_Tourbillon.jpg"}
];

function renderCars(){
 const query=document.getElementById("search").value.toLowerCase().trim();
 const brand=document.getElementById("brand").value;
 const filtered=cars.filter(c=>
  (c.name+" "+c.brand).toLowerCase().includes(query)&&
  (!brand||c.brand===brand)
 );
 document.getElementById("cars").innerHTML=filtered.map(c=>`
 <a href="cars/detail.html?car=${c.slug}" class="card">
  <div class="car-art">
   <img src="${c.image}" alt="${c.brand} ${c.name}" loading="lazy"
   onerror="this.style.display='none';this.parentElement.textContent='🏎️';">
  </div>
  <div class="card-content">
   <div class="brand">${c.brand}</div>
   <h3>${c.name}</h3>
   <div class="spec">
    Güç: ${c.power} hp<br>
    0–100 km/sa: ${c.zero.toLocaleString("tr-TR")} sn<br>
    Azami hız: ${c.speed} km/sa
   </div>
   <div class="price">${c.price}</div>
   <span class="detail-link">Detayları incele →</span>
  </div>
 </a>`).join("");

 if(!filtered.length){
  document.getElementById("cars").innerHTML="<p>Araba bulunamadı.</p>";
 }
}

function fillSelects(){
 ["car1","car2"].forEach((id,index)=>{
  document.getElementById(id).innerHTML=cars.map((c,i)=>
   `<option value="${i}" ${i===index?"selected":""}>${c.brand} ${c.name}</option>`
  ).join("");
 });
}

function compareCars(){
 const a=cars[Number(document.getElementById("car1").value)];
 const b=cars[Number(document.getElementById("car2").value)];
 const result=document.getElementById("result");

 if(!a||!b){
  result.textContent="Lütfen iki otomobil seç.";
  return;
 }

 if(a===b){
  result.textContent="Cano, karşılaştırmak için iki farklı araba seç.";
  return;
 }

 const nameA=`${a.brand} ${a.name}`;
 const nameB=`${b.brand} ${b.name}`;
 const categories=[
  {name:"Motor gücü",valueA:a.power,valueB:b.power,unit:"hp",higher:true},
  {name:"0–100 km/sa",valueA:a.zero,valueB:b.zero,unit:"sn",higher:false},
  {name:"Azami hız",valueA:a.speed,valueB:b.speed,unit:"km/sa",higher:true}
 ];

 let scoreA=0,scoreB=0;

 const rows=categories.map(c=>{
  let winner="Eşit";
  const x=Number(c.valueA),y=Number(c.valueB);
  const diff=`${Math.abs(x-y).toLocaleString("tr-TR")} ${c.unit}`;

  if(x!==y){
   const aWins=c.higher?x>y:x<y;
   winner=aWins?nameA:nameB;
   if(aWins)scoreA++;
   else scoreB++;
  }

  return `<tr>
   <td>${c.name}</td>
   <td style="${winner===nameA?'background:#164b2b;color:#8cffad;':''}">${c.valueA} ${c.unit}${winner===nameA?" 🏆":""}</td>
   <td style="${winner===nameB?'background:#164b2b;color:#8cffad;':''}">${c.valueB} ${c.unit}${winner===nameB?" 🏆":""}</td>
   <td>${diff}</td>
   <td>${winner}</td>
  </tr>`;
 }).join("");

 const verdict=scoreA===scoreB
  ?"Karşılaştırma berabere!"
  :scoreA>scoreB
  ?`${nameA} daha fazla kategoride önde.`
  :`${nameB} daha fazla kategoride önde.`;

 result.innerHTML=`
 <div style="margin-top:24px;padding:20px;border:1px solid #444;border-radius:16px;overflow-x:auto">
  <h2 style="color:#8cffad">🏁 NORRVEYO | Araç Karşılaştırma</h2>
  <h3>${nameA} <span style="color:#888">VS</span> ${nameB}</h3>
  <table>
   <thead><tr>
    <th>Özellik</th><th>${nameA}</th><th>${nameB}</th><th>Fark</th><th>Önde olan</th>
   </tr></thead>
   <tbody>${rows}
    <tr style="background:#252525">
     <td>Yaklaşık fiyat</td>
     <td>${a.price||"Belirtilmemiş"}</td>
     <td>${b.price||"Belirtilmemiş"}</td>
     <td>Fiyatlar değişebilir</td>
     <td>Kesin kazanan yok</td>
    </tr>
   </tbody>
  </table>
  <div style="margin-top:20px;padding:20px;background:linear-gradient(135deg,#202020,#303030);border:1px solid #444;border-radius:16px">
   <h3 style="color:#8cffad">🏆 Karşılaştırma puanı</h3>
   <p style="padding:10px;background:#183b28;border-radius:8px">🚗 ${nameA}: <b style="color:#8cffad">${scoreA}</b> kategori</p>
   <p style="padding:10px;background:#183b28;border-radius:8px">🚗 ${nameB}: <b style="color:#8cffad">${scoreB}</b> kategori</p>
   <h3>${verdict}</h3>
   <p style="color:#bbb;font-size:13px">Puanlama yalnızca güç, hızlanma ve azami hızı kapsar. Bu sonuç genel olarak en iyi otomobili belirlemez.</p>
  </div>
 </div>`;
}

document.getElementById("search").addEventListener("input",renderCars);
document.getElementById("brand").addEventListener("change",renderCars);
document.getElementById("compareButton").addEventListener("click",compareCars);

fillSelects();
renderCars();
</script>
</body>
</html>
