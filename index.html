
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NORRVEYO | Süper Otomobiller</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101014;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: linear-gradient(120deg, #b50012, #ef202e);
  padding: 28px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin-bottom: 0;
}

nav {
  background: #19191f;
  padding: 14px;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 12px;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 22px;
}

.tools {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 22px 0;
}

input, select, button {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #41414a;
  background: #222229;
  color: white;
  font-size: 15px;
}

input {
  flex: 1;
  min-width: 200px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 18px;
}

.card {
  display: block;
  color: white;
  text-decoration: none;
  background: #1c1c23;
  border: 1px solid #34343d;
  border-radius: 14px;
  overflow: hidden;
  transition: transform .2s, border-color .2s;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #ff303d;
}

.car-art {
  min-height: 125px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #303039, #15151b);
  font-size: 65px;
}

.card-content {
  padding: 16px;
}

.brand {
  color: #ff515b;
  font-size: 13px;
  font-weight: bold;
  text-transform: uppercase;
}

.card h3 {
  margin: 8px 0 12px;
}

.spec {
  color: #d2d2d8;
  line-height: 1.8;
  font-size: 14px;
}

.price {
  margin-top: 12px;
  font-weight: bold;
}

.detail-link {
  display: inline-block;
  margin-top: 14px;
  padding: 10px 14px;
  background: #d71920;
  border-radius: 8px;
  font-size: 14px;
}

.compare {
  margin-top: 40px;
  padding: 22px;
  background: #1c1c23;
  border-radius: 14px;
}

.compare select {
  margin: 5px;
  max-width: 100%;
}

button {
  background: #d71920;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #f12a35;
}

#result {
  line-height: 1.8;
  overflow-wrap: anywhere;
}

footer {
  margin-top: 40px;
  padding: 24px;
  text-align: center;
  background: #19191f;
  color: #aaa;
}
</style>
</head>

<body>

<header>
<h1>🏎️ NORRVEYO</h1>
  <p>Dünyanın en özel süper otomobillerini keşfet!</p>
</header>

<nav>
  <a href="#cars">Arabalar</a>
  <a href="#compare">Karşılaştırma</a>
</nav>

<main>
  <h2 id="cars">🚘 Süper otomobil koleksiyonu</h2>
  <p>20 efsane otomobili keşfet, detaylarını incele ve karşılaştır.</p>

  <div class="tools">
    <input id="search" placeholder="Araba veya marka ara...">
    <select id="brand">
      <option value="">Bütün markalar</option>
      <option>Ferrari</option>
      <option>Lamborghini</option>
      <option>McLaren</option>
      <option>Porsche</option>
      <option>Bugatti</option>
    </select>
  </div>

  <div id="cars" class="grid"></div>

  <section id="compare" class="compare">
    <h2>⚡ Araba karşılaştır</h2>
    <p>İki araba seç ve özelliklerini yan yana incele.</p>
    <select id="car1"></select>
    <select id="car2"></select>
    <button id="compareButton">Arabaları karşılaştır</button>
    <div id="result"></div>
  </section>
</main>

<footer>
  © 2026 Supercar World · Otomobil tutkunları için
</footer>

<script>
const cars = [
  {name:"296 GTB",brand:"Ferrari",slug:"ferrari-296",power:830,zero:2.9,speed:330,price:"Yaklaşık 300.000 $"},
  {name:"SF90 Stradale",brand:"Ferrari",slug:"ferrari-sf90",power:1000,zero:2.5,speed:340,price:"Yaklaşık 500.000 $"},
  {name:"F8 Tributo",brand:"Ferrari",slug:"ferrari-f8",power:720,zero:2.9,speed:340,price:"Fiyatı değişebilir"},
  {name:"812 Competizione",brand:"Ferrari",slug:"ferrari-812-competizione",power:830,zero:2.9,speed:340,price:"Sınırlı üretim"},
  {name:"Daytona SP3",brand:"Ferrari",slug:"ferrari-daytona-sp3",power:840,zero:2.9,speed:340,price:"Sınırlı üretim"},

  {name:"Revuelto",brand:"Lamborghini",slug:"lamborghini-revuelto",power:1015,zero:2.5,speed:350,price:"Yaklaşık 600.000 $"},
  {name:"Huracán STO",brand:"Lamborghini",slug:"lamborghini-huracan-sto",power:640,zero:3.0,speed:310,price:"Yaklaşık 330.000 $"},
  {name:"Aventador SVJ",brand:"Lamborghini",slug:"lamborghini-aventador-svj",power:770,zero:2.8,speed:350,price:"İkinci el fiyatı değişir"},
  {name:"Temerario",brand:"Lamborghini",slug:"lamborghini-temerario",power:920,zero:2.7,speed:340,price:"Fiyatı değişebilir"},
  {name:"Sián FKP 37",brand:"Lamborghini",slug:"lamborghini-sian",power:819,zero:2.8,speed:350,price:"Sınırlı üretim"},

  {name:"750S",brand:"McLaren",slug:"mclaren-750s",power:750,zero:2.8,speed:332,price:"Yaklaşık 330.000 $"},
  {name:"765LT",brand:"McLaren",slug:"mclaren-765lt",power:765,zero:2.8,speed:330,price:"Sınırlı üretim"},
  {name:"Artura",brand:"McLaren",slug:"mclaren-artura",power:700,zero:3.0,speed:330,price:"Yaklaşık 250.000 $"},
  {name:"P1",brand:"McLaren",slug:"mclaren-p1",power:916,zero:2.8,speed:350,price:"İkinci el fiyatı değişir"},
  {name:"Senna",brand:"McLaren",slug:"mclaren-senna",power:800,zero:2.8,speed:335,price:"Sınırlı üretim"},

  {name:"911 GT3 RS",brand:"Porsche",slug:"porsche-911-gt3-rs",power:525,zero:3.2,speed:296,price:"Yaklaşık 250.000 $"},
  {name:"911 Turbo S",brand:"Porsche",slug:"porsche-911-turbo-s",power:650,zero:2.7,speed:330,price:"Yaklaşık 230.000 $"},
  {name:"918 Spyder",brand:"Porsche",slug:"porsche-918-spyder",power:887,zero:2.6,speed:345,price:"İkinci el fiyatı değişir"},

  {name:"Chiron",brand:"Bugatti",slug:"bugatti-chiron",power:1500,zero:2.4,speed:420,price:"Milyonlarca dolar"},
  {name:"Tourbillon",brand:"Bugatti",slug:"bugatti-tourbillon",power:1800,zero:2.0,speed:445,price:"Yaklaşık 4 milyon €"}
];

function renderCars() {
  const query = document.getElementById("search").value.toLowerCase();
  const brand = document.getElementById("brand").value;

  const filtered = cars.filter(c =>
    (c.name + " " + c.brand).toLowerCase().includes(query) &&
    (!brand || c.brand === brand)
  );

  document.getElementById("cars").innerHTML = filtered.map(c => `
   <a href="cars/detail.html?car=${c.slug}" class="card">
      <div class="car-art">🏎️</div>
      <div class="card-content">
        <div class="brand">${c.brand}</div>
        <h3>${c.name}</h3>
        <div class="spec">
          Güç: ${c.power} hp<br>
          0–100 km/sa: ${c.zero.toLocaleString("tr-TR")} sn<br>
          Azami hız: ${c.speed} km/sa
        </div>
        <div class="price">${c.price}</div>
        <span class="detail-link">Detayları incele →</span>
      </div>
    </a>
  `).join("");

  if (!filtered.length) {
    document.getElementById("cars").innerHTML =
      "<p>Araba bulunamadı.</p>";
  }
}

function fillSelects() {
  ["car1", "car2"].forEach((id, index) => {
    document.getElementById(id).innerHTML = cars.map((c, i) =>
      `<option value="${i}" ${i === index ? "selected" : ""}>${c.brand} ${c.name}</option>`
    ).join("");
  });
}

function compareCars() {
  const a = cars[Number(document.getElementById("car1").value)];
  const b = cars[Number(document.getElementById("car2").value)];
  const result = document.getElementById("result");

  if (!a || !b) {
    result.textContent = "Lütfen iki otomobil seç.";
    return;
  }

  const nameA = `${a.brand} ${a.name}`;
  const nameB = `${b.brand} ${b.name}`;

  const categories = [
    {
      name: "Motor gücü",
      valueA: a.power,
      valueB: b.power,
      unit: "hp",
      higher: true
    },
    {
      name: "0–100 km/sa",
      valueA: a.zero,
      valueB: b.zero,
      unit: "sn",
      higher: false
    },
    {
      name: "Azami hız",
      valueA: a.speed,
      valueB: b.speed,
      unit: "km/sa",
      higher: true
    }
  ];

  let scoreA = 0;
  let scoreB = 0;

const rows = categories.map(c => {
  const valid =
    Number.isFinite(Number(c.valueA)) &&
    Number.isFinite(Number(c.valueB));

  let winner = "Eşit";
  let diff = "Hesaplanamadı";

  if (valid) {
    const x = Number(c.valueA);
    const y = Number(c.valueB);

    diff = `${Math.abs(x - y).toLocaleString("tr-TR")} ${c.unit}`;

    if (x !== y) {
      const aWins = c.higher ? x > y : x < y;
      winner = aWins ? nameA : nameB;
      if (aWins) scoreA++;
      else scoreB++;
    }
  }

  const colorA = winner === nameA
    ? "background:#164b2b; color:#8cffad;"
    : "";

  const colorB = winner === nameB
    ? "background:#164b2b; color:#8cffad;"
    : "";

  return `
    <tr>
      <td>${c.name}</td>
     <td style="${colorA}; padding:12px; text-align:center;">
        ${c.valueA} ${c.unit}${winner === nameA ? " 🏆" : ""}
      </td>
     <td style="${colorB}; padding:12px; text-align:center;">
        ${c.valueB} ${c.unit}${winner === nameB ? " 🏆" : ""}
      </td>
      <td>${diff}</td>
      <td>${valid ? winner : "Veri yok"}</td>
    </tr>
  `;
}).join("");

  const verdict =
    scoreA === scoreB
      ? "Karşılaştırma berabere!"
      : scoreA > scoreB
        ? `${nameA} daha fazla kategoride önde.`
        : `${nameB} daha fazla kategoride önde.`;

  result.innerHTML = `
   <style>
#result table {
  border: 1px solid #444;
  border-radius: 12px;
  overflow: hidden;
  color: #f5f5f5;
}

#result th {
  background: #292929;
  color: #8cffad;
  padding: 14px 10px;
  text-align: center;
  border-bottom: 1px solid #555;
}

#result td {
  padding: 12px 10px;
  text-align: center;
  border-bottom: 1px solid #383838;
}

#result tbody tr:nth-child(even) {
  background: #191919;
}

#result td:first-child,
#result th:first-child {
  text-align: left;
}
</style> <div style="margin-top:24px; padding:20px;
      border:1px solid #444; border-radius:16px;
      overflow-x:auto;">
      <h2 style="margin:0 0 18px; font-size:24px; color:#8cffad;">
  🏁 NORRVEYO | Araç Karşılaştırma
</h2>
      <h3>${nameA} <span style="color:#888;">VS</span> ${nameB}</h3>

      <table style="width:100%; border-collapse:collapse;
        min-width:600px; font-size:14px; line-height:1.6;">
        <thead>
          <tr>
            <th>Özellik</th>
            <th>${nameA}</th>
            <th>${nameB}</th>
            <th>Fark</th>
            <th>Önde olan</th>
          </tr>
        </thead>
        <tbody>
  ${rows}
  <tr>
    <td>Yaklaşık fiyat</td>
    <td>${a.price || "Belirtilmemiş"}</td>
    <td>${b.price || "Belirtilmemiş"}</td>
    <td>Fiyatlar değişebilir</td>
    <td>Kesin kazanan yok</td>
  </tr>
</tbody>
      </table>

      <div style="margin-top:20px; padding:16px;
        background:#202020; border-radius:12px;">
        <h3>🏆 Karşılaştırma puanı</h3>
        <p>${nameA}: <b>${scoreA}</b> kategori</p>  
        <p>${nameB}: <b>${scoreB}</b> kategori</p>
        <h3>${verdict}</h3>
        <p style="color:#bbb; font-size:13px;">
          Puanlama yalnızca güç, hızlanma ve azami hızı kapsar.
          Bu sonuç genel olarak en iyi otomobili belirlemez.
        </p>
      </div>
    </div>
  `;
}
document.getElementById("search").addEventListener("input", renderCars);
document.getElementById("brand").addEventListener("change", renderCars);
document.getElementById("compareButton").addEventListener("click", compareCars);

fillSelects();
renderCars();
</script>

</body>
</html>
